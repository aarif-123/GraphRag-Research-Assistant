<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Aether — Intent-Based Retrieval Routing</title>
<desc>Three retrieval paths depending on whether the query is a title, metadata, or concept question</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9c9a92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background -->
<rect x="0" y="0" width="680" height="620" fill="#1a1a18" rx="0"/>

<!-- Title -->
<text x="340" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" letter-spacing="2" opacity="0.45" fill="#c2c0b6">Intent-Based Retrieval Routing</text>

<!-- USER QUERY -->
<rect x="215" y="36" width="250" height="48" rx="8" stroke-width="0.5" fill="#444441" stroke="#b4b2a9"/>
<text x="340" y="55" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#d3d1c7">User query</text>
<text x="340" y="72" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#b4b2a9">natural language research question</text>

<line x1="340" y1="85" x2="340" y2="118" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>

<!-- INTENT DETECTOR -->
<rect x="190" y="120" width="300" height="48" rx="24" stroke-width="0.5" fill="#3c3489" stroke="#afa9ec"/>
<text x="340" y="139" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#cecbf6">Intent detector</text>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#afa9ec">Groq LLM — fast classification pass</text>

<!-- three arrows out -->
<line x1="230" y1="169" x2="120" y2="222" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>
<line x1="340" y1="169" x2="340" y2="222" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>
<line x1="450" y1="169" x2="560" y2="222" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>

<!-- intent labels on arrows -->
<text x="155" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" opacity="0.65" fill="#c2c0b6">Title query</text>
<text x="340" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" opacity="0.65" fill="#c2c0b6">Metadata query</text>
<text x="525" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" opacity="0.65" fill="#c2c0b6">Concept query</text>

<!-- example queries as muted subtext -->
<text x="50" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" opacity="0.35" fill="#c2c0b6">"Find the Vaswani attention paper"</text>
<text x="340" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" opacity="0.35" fill="#c2c0b6">"NeurIPS 2023 diffusion models"</text>
<text x="630" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" opacity="0.35" fill="#c2c0b6">"How does attention work?"</text>

<!-- BRANCH BOXES ROW 1 -->
<rect x="28" y="236" width="184" height="56" rx="8" stroke-width="0.5" fill="#0c447c" stroke="#85b7eb"/>
<text x="120" y="257" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#b5d4f4">Graph by title + ID</text>
<text x="120" y="275" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#85b7eb">Exact node lookup</text>

<rect x="248" y="236" width="184" height="56" rx="8" stroke-width="0.5" fill="#0c447c" stroke="#85b7eb"/>
<text x="340" y="257" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#b5d4f4">Graph only</text>
<text x="340" y="275" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#85b7eb">Metadata + year filter</text>

<rect x="468" y="236" width="184" height="56" rx="8" stroke-width="0.5" fill="#0c447c" stroke="#85b7eb"/>
<text x="560" y="257" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#b5d4f4">Supabase vector first</text>
<text x="560" y="275" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#85b7eb">Semantic seed search</text>

<!-- BRANCH BOXES ROW 2 -->
<line x1="120" y1="293" x2="120" y2="328" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>
<line x1="340" y1="293" x2="340" y2="366" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="560" y1="293" x2="560" y2="328" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>

<rect x="28" y="330" width="184" height="56" rx="8" stroke-width="0.5" fill="#085041" stroke="#5dcaa5"/>
<text x="120" y="351" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#9fe1cb">Supabase by paper IDs</text>
<text x="120" y="369" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5dcaa5">Chunk retrieval on seed</text>

<!-- metadata path goes direct to RRF (dashed - shorter path) -->
<text x="340" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" opacity="0.4" fill="#c2c0b6">direct to fusion</text>

<rect x="468" y="330" width="184" height="56" rx="8" stroke-width="0.5" fill="#085041" stroke="#5dcaa5"/>
<text x="560" y="351" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#9fe1cb">Graph expand</text>
<text x="560" y="369" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5dcaa5">via CITES / WRITTEN_BY</text>

<!-- converge to RRF -->
<line x1="120" y1="387" x2="270" y2="434" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>
<line x1="340" y1="393" x2="340" y2="434" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="560" y1="387" x2="410" y2="434" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>

<!-- RRF -->
<rect x="175" y="436" width="330" height="48" rx="8" stroke-width="0.5" fill="#712b13" stroke="#f0997b"/>
<text x="340" y="455" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#f5c4b3">RRF Fusion + Relevance Filter</text>
<text x="340" y="471" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#f0997b">unified top-K  ·  drop chunks below 0.22 similarity</text>

<line x1="340" y1="485" x2="340" y2="518" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>

<!-- Final answer -->
<rect x="175" y="520" width="330" height="56" rx="8" stroke-width="0.5" fill="#27500a" stroke="#97c459"/>
<text x="340" y="541" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#c0dd97">Grounded answer + verification</text>
<text x="340" y="559" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#97c459">confidence score  ·  PASS / PARTIAL / FAIL</text>

<!-- small legend -->
<rect x="40" y="586" width="10" height="10" rx="2" fill="#262624" stroke="rgba(222,220,209,0.3)" stroke-width="0.5"/>
<text x="56" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" opacity="0.5" fill="#c2c0b6">dashed line = direct bypass (no graph expansion needed)</text>
</svg>