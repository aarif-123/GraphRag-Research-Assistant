[project]
name = "graph-rag-research-assistant"
version = "0.1.0"
description = "GraphRAG Research Assistant API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "pydantic==2.11.7",
    "python-dotenv==1.0.1",
    "supabase==2.9.1",
    "neo4j==5.25.0",
    "numpy==1.26.4",
    "pymupdf==1.24.2",
    "pymongo>=4.0.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "mcp>=1.2.0"
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".github",
    ".pytest_cache",
    ".vercel",
    "frontend",
    "scratch_*.py",
    "test_arxiv_debug.py",
    "test_prompt.py",
    "test_research_cycle.py",
    "test_sources.py",
    "fix_symbols.py"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # Line too long (handled by ruff format)
    "E402",  # Module level import not at top (allow for env setting before imports in test/script files)
    "E722",  # Bare except in legacy scripts
    "F841",  # Unused variable assignment in legacy code
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
