[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".github",
    ".pytest_cache",
    ".vercel",
    "frontend",
    "scratch_*.py",
    "test_arxiv_debug.py",
    "test_prompt.py",
    "test_research_cycle.py",
    "test_sources.py",
    "fix_symbols.py"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # Line too long (handled by ruff format)
    "E402",  # Module level import not at top (allow for env setting before imports in test/script files)
    "E722",  # Bare except in legacy scripts
    "F841",  # Unused variable assignment in legacy code
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
