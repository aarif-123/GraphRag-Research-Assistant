name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Lint & Format
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff>=0.4.0

      - name: Lint (ruff check)
        run: ruff check . --output-format=github

      - name: Format check (ruff format)
        run: ruff format --check .

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Type Check
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install type-check dependencies
        run: pip install mypy>=1.10.0 types-requests>=2.31.0

      - name: Run mypy on source modules
        # Ignore missing stubs for third-party libraries (neo4j, supabase, etc.)
        run: |
          mypy app/sources/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --python-version 3.11

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Environment Config Validation
  # ──────────────────────────────────────────────────────────────────────────
  validate-env:
    name: Env Config Validation
    runs-on: ubuntu-latest
    env:
      # Dummy values — only validating format/presence logic, not real services
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-role-key
      NEO4J_URI: neo4j+s://ci-stub.databases.neo4j.io
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-stub-password
      GROQ_API_KEY: gsk_ci_stub_key
      MONGODB_URI: mongodb://localhost:27017
      JWT_SECRET: ci-stub-jwt-secret-at-least-32-chars-long
      # Numeric config
      MAX_GRAPH_NODES: "25"
      GROQ_TIMEOUT: "30"
      EMBED_TIMEOUT: "20"
      RATE_LIMIT_PER_MIN: "30"
      RELEVANCE_FLOOR: "0.22"
      MMR_LAMBDA: "0.6"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install python-dotenv
        run: pip install python-dotenv>=1.0.1

      - name: Run env validator
        run: python scripts/validate_env.py

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Unit Tests
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production + dev dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Integration Tests (all HTTP mocked — no real API keys needed)
  # ──────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production + dev dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration tests
        # Integration tests import app.sources.* which reads env vars at module level
        # We stub the minimum required values so imports succeed
        env:
          CORE_API_KEY: ci-stub-core-key
          S2_API_KEY: ""
        run: pytest tests/integration/ -v --tb=short
