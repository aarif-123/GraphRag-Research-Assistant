[pytest]
# Discover all tests under tests/
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Run async tests without needing @pytest.mark.asyncio on every function
asyncio_mode = auto

# Show short tracebacks; suppress noisy third-party warnings
addopts = --tb=short -q
filterwarnings =
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:httpx
